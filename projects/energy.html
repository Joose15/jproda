<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCF8575 Interactivo + LED</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:'Inter',sans-serif;
background:#212121;
color:white;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* CHIP */

.chip-wrapper{
display:flex;
flex-direction:column;
align-items:center;
}

.chip{
position:relative;
display:flex;
}

/* CUERPO */

.chip-body{
width:240px;
height:490px;
background:linear-gradient(145deg, #0e0e0e, #1a1a1a);
border-radius:16px;
border:1px solid rgba(203,254,0,0.2);
display:flex;
justify-content:center;
align-items:center;
font-weight:600;
color:#CBFE00;
box-shadow:
0 0 10px rgba(203,254,0,0.15),
0 0 30px rgba(203,254,0,0.08),
inset 0 0 20px rgba(255,255,255,0.02);
}

.chip-body::before{
content:"";
position:absolute;
width:90%;
height:90%;
border-radius:12px;
border:1px solid rgba(255,255,255,0.04);
}

/* PINES */

.pins{
position:absolute;
display:flex;
flex-direction:column;
justify-content:space-between;
height:380px;
top:20px;
}

.left{ left:-130px; }
.right{ right:-130px; }

/* PIN */

.pin{
display:flex;
align-items:center;
gap:10px;
cursor:pointer;
}

.pin-box{
background:#0f0f0f;
padding:10px 16px;
border-radius:10px;
font-size:13px;
border:1px solid rgba(255,255,255,0.08);
transition:0.2s;
min-width:55px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.4);
}

.pin:hover .pin-box{
background:#CBFE00;
color:black;
box-shadow:0 0 20px rgba(203,254,0,0.4);
}

.pin.active .pin-box{
background:#CBFE00;
color:black;
font-weight:600;
}

.left .pin{ justify-content:flex-end; }
.right .pin{ justify-content:flex-start; }

/* PATILLA */

.leg{
width:35px;
height:2px;
background:#aaa;
transition:0.2s;
}

.pin.active .leg{
background:#CBFE00;
}

.number{
font-size:11px;
opacity:0.6;
}

/* INFO */

.info{
margin-top:30px;
border-left:3px solid #CBFE00;
padding-left:15px;
max-width:320px;
}

/* ================= LED ================= */

.led-system{
position:absolute;
left:-260px;
top:150px;
display:flex;
flex-direction:column;
align-items:center;
}

/* cables */

.wire{
width:3px;
background:#888;
transition:0.2s;
}

.wire.p1{ height:45px; }
.wire.gnd{ height:45px; }

/* LED */

.led{
width:28px;
height:28px;
border-radius:50%;
background:#220000;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 10px rgba(255,0,0,0.15);
transition:0.3s;
}

.led-core{
width:14px;
height:14px;
border-radius:50%;
background:red;
opacity:0.2;
transition:0.3s;
}

/* resistor */

.resistor{
width:14px;
height:42px;
background:linear-gradient(90deg,#c69c6d,#a67c52);
border-radius:4px;
margin:8px 0;
position:relative;
}

.resistor::before{
content:"";
position:absolute;
top:10px;
left:0;
right:0;
height:4px;
background:purple;
}

.resistor::after{
content:"";
position:absolute;
bottom:10px;
left:0;
right:0;
height:4px;
background:black;
}

/* ON STATE */

.led.on{
background:red;
box-shadow:0 0 25px red, 0 0 60px red;
}

.led.on .led-core{
opacity:1;
}

.led.on ~ .wire{
background:#CBFE00;
}

</style>
</head>

<body>

<div class="chip-wrapper">

<div class="chip">

<!-- LED -->
<div class="led-system">
<div class="wire p1"></div>
<div class="led"><div class="led-core"></div></div>
<div class="resistor"></div>
<div class="wire gnd"></div>
</div>

<!-- PINES IZQUIERDA -->
<div class="pins left">

<div class="pin" data-info="Salida de interrupción (open-drain)">
<div class="pin-box">INT</div><div class="leg"></div><span class="number">1</span>
</div>

<div class="pin" data-info="Dirección I2C (bit A1)">
<div class="pin-box">A1</div><div class="leg"></div><span class="number">2</span>
</div>

<div class="pin" data-info="Dirección I2C (bit A2)">
<div class="pin-box">A2</div><div class="leg"></div><span class="number">3</span>
</div>

<div class="pin" data-info="GPIO P0">
<div class="pin-box">P0</div><div class="leg"></div><span class="number">4</span>
</div>

<div class="pin" data-info="GPIO P1 (Control LED)">
<div class="pin-box">P1</div><div class="leg"></div><span class="number">5</span>
</div>

<div class="pin" data-info="GPIO P2">
<div class="pin-box">P2</div><div class="leg"></div><span class="number">6</span>
</div>

<div class="pin" data-info="GPIO P3">
<div class="pin-box">P3</div><div class="leg"></div><span class="number">7</span>
</div>

<div class="pin" data-info="GPIO P4">
<div class="pin-box">P4</div><div class="leg"></div><span class="number">8</span>
</div>

<div class="pin" data-info="GPIO P5">
<div class="pin-box">P5</div><div class="leg"></div><span class="number">9</span>
</div>

<div class="pin" data-info="GPIO P6">
<div class="pin-box">P6</div><div class="leg"></div><span class="number">10</span>
</div>

<div class="pin" data-info="GPIO P7">
<div class="pin-box">P7</div><div class="leg"></div><span class="number">11</span>
</div>

<div class="pin" data-info="Tierra (GND)">
<div class="pin-box">GND</div><div class="leg"></div><span class="number">12</span>
</div>

</div>

<!-- CUERPO -->
<div class="chip-body">
PCF8575
</div>

<!-- PINES DERECHA -->
<div class="pins right">

<div class="pin" data-info="Alimentación (VCC)">
<span class="number">24</span><div class="leg"></div><div class="pin-box">VCC</div>
</div>

<div class="pin" data-info="I2C Data (SDA)">
<span class="number">23</span><div class="leg"></div><div class="pin-box">SDA</div>
</div>

<div class="pin" data-info="I2C Clock (SCL)">
<span class="number">22</span><div class="leg"></div><div class="pin-box">SCL</div>
</div>

<div class="pin" data-info="Dirección I2C (bit A0)">
<span class="number">21</span><div class="leg"></div><div class="pin-box">A0</div>
</div>

<div class="pin" data-info="GPIO P17">
<span class="number">20</span><div class="leg"></div><div class="pin-box">P17</div>
</div>

<div class="pin" data-info="GPIO P16">
<span class="number">19</span><div class="leg"></div><div class="pin-box">P16</div>
</div>

<div class="pin" data-info="GPIO P15">
<span class="number">18</span><div class="leg"></div><div class="pin-box">P15</div>
</div>

<div class="pin" data-info="GPIO P14">
<span class="number">17</span><div class="leg"></div><div class="pin-box">P14</div>
</div>

<div class="pin" data-info="GPIO P13">
<span class="number">16</span><div class="leg"></div><div class="pin-box">P13</div>
</div>

<div class="pin" data-info="GPIO P12">
<span class="number">15</span><div class="leg"></div><div class="pin-box">P12</div>
</div>

<div class="pin" data-info="GPIO P11">
<span class="number">14</span><div class="leg"></div><div class="pin-box">P11</div>
</div>

<div class="pin" data-info="GPIO P10">
<span class="number">13</span><div class="leg"></div><div class="pin-box">P10</div>
</div>

</div>

</div>

<div class="info" id="info">
Haz clic en un pin
</div>

</div>

<script>

const pins = document.querySelectorAll(".pin");
const info = document.getElementById("info");
const led = document.querySelector(".led");

pins.forEach(pin => {

pin.addEventListener("click", () => {

pins.forEach(p => p.classList.remove("active"));
pin.classList.add("active");

const name = pin.querySelector('.pin-box').innerText;

info.innerText = name + " → " + pin.dataset.info;

// LED control realista
if(name === "P1"){
led.classList.toggle("on");
}

});

});

</script>

</body>
</html>
