<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jose Peñalba — Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;
background:#212121;
color:white;
overflow-x:hidden;

}

/* ========================= */
/* BACKGROUND ANIMADO */
/* ========================= */

.bg{

position:fixed;
width:100%;
height:100%;
z-index:-2;

background:
radial-gradient(circle at 20% 30%, #CBFE0033, transparent 40%),
radial-gradient(circle at 80% 70%, #CBFE0040, transparent 40%),
radial-gradient(circle at 50% 50%, #CBFE0025, transparent 50%);

filter:blur(140px);

animation:move 18s infinite alternate ease-in-out;

}

@keyframes move{

0%{transform:translate(-10%, -10%) scale(1)}
100%{transform:translate(10%, 10%) scale(1.2)}

}

/* GRID BACKGROUND */

.grid{

position:fixed;
width:100%;
height:100%;
background-image:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

background-size:40px 40px;

z-index:-1;

}

/* ========================= */
/* NAVBAR */
/* ========================= */

nav{

position:fixed;

top:25px;
left:50%;

transform:translateX(-50%);

background:rgba(0,0,0,0.6);

backdrop-filter:blur(20px);

border-radius:40px;

padding:12px 25px;

border:1px solid rgba(255,255,255,0.1);

box-shadow:0 0 30px rgba(0,0,0,0.4);

z-index:100;

transition:0.4s;

}

.logo{

font-family:'Orbitron';
letter-spacing:2px;

}

nav ul{

display:flex;

gap:35px;

list-style:none;

align-items:center;

}

nav a{

color:#cfcfcf;

text-decoration:none;

font-size:16px;

padding:8px 14px;

border-radius:20px;

transition:0.3s;

}

nav a:hover{

color:#CBFE00;

}

nav a{

color:white;
text-decoration:none;
opacity:0.7;
transition:0.3s;

}

nav a:hover{

opacity:1;

}
nav.scrolled{

background:rgba(0,0,0,0.35);

border:1px solid rgba(255,255,255,0.05);

box-shadow:0 10px 40px rgba(0,0,0,0.5);

}

/* ========================= */
/* HERO */
/* ========================= */

.hero{

height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:0 20px;

}

.hero h1{

font-size:70px;
margin-top:15px;
font-weight:700;

background:linear-gradient(90deg,#CBFE00,#9EDB00);

-webkit-background-clip:text;

color:transparent;

}

.hero p{

margin-top:20px;

font-size:22px;

opacity:0.7;

}

.buttons{

margin-top:40px;

display:flex;

gap:20px;

}

.btn{

padding:14px 30px;

border-radius:14px;

background:linear-gradient(135deg,#CBFE00,#9EDB00);

color:#212121;

font-weight:600;

text-decoration:none;

transition:0.4s;

}

.btn:hover{

transform:translateY(-4px);

box-shadow:0 10px 40px rgba(203,254,0,0.35);

}



.btn-outline{

background:transparent;

border:1px solid rgba(255,255,255,0.2);

color:white;

}

/* ========================= */
/* SECTION */
/* ========================= */

section{

padding:120px 10%;

}

.title{

font-size:40px;

margin-bottom:60px;

}

/* ========================= */
/* CARDS */
/* ========================= */


.project{
cursor:pointer;
}
.card{

padding:40px;

border-radius:20px;

background:rgba(255,255,255,0.03);

border:1px solid rgba(255,255,255,0.05);

backdrop-filter:blur(10px);

transition:0.4s;

}

.card:hover{

transform:translateY(-10px) scale(1.02);

background:rgba(255,255,255,0.06);

}

/* ========================= */
/* PROJECTS */
/* ========================= */

.project{

overflow:hidden;

border-radius:20px;

background:rgba(255,255,255,0.03);

border:1px solid rgba(203,254,0,0.15);
transition:0.4s;

}

.project:hover{

transform:scale(1.03);

box-shadow:0 10px 35px rgba(203,254,0,0.2);

}

.project-img{

height:200px;

background:linear-gradient(135deg,#CBFE0025,#CBFE0010);

display:flex;

align-items:center;

justify-content:center;

font-size:40px;

}

.project-content{

padding:30px;

}

.project-content p{

opacity:0.7;

}

/* ========================= */
/* FOOTER */
/* ========================= */

footer{

text-align:center;

padding:60px;

opacity:0.5;

}

.grid-cards{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:30px;

}

@media(max-width:900px){

.grid-cards{
grid-template-columns:1fr;
}

}

.projects-more{
margin-top:40px;
display:flex;
justify-content:center;
}

.hero-logo{

width:120px;
margin-bottom:0px;

animation:float 4s ease-in-out infinite;

}

@keyframes float{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0px);
}

}


.nav-logo{
height:50px;
}

</style>

</head>

<body>

<div class="bg"></div>
<div class="grid"></div>

<nav>


<ul>

<li><a href="#">About</a></li>
<li><a href="#">Skills</a></li>
<li><a href="#">Projects</a></li>
<li><a href="#">Contact</a></li>

</ul>

</nav>

<section class="hero">

<img src="img/logo.png" class="hero-logo">

<h1>Jose Peñalba</h1>
<p>Hardware Builder · Embedded Systems · Tech Products</p>

<div class="buttons">

<a href="#" class="btn">View Projects</a>
<a href="#" class="btn btn-outline">Contact</a>

</div>

</section>


<section>

<h2 class="title">Relevant Projects</h2>

<div id="projects-container" class="grid-cards"></div>

<div class="projects-more">
<a href="projects/projects.html" class="btn">View More Projects</a>
</div>

</section>

<footer>

© 2026 Jose Peñalba

</footer>

<script src="data/projects.js"></script>

card.innerHTML = `

window.addEventListener("scroll", function(){

const nav = document.querySelector("nav")

if(window.scrollY > 50){
nav.classList.add("scrolled")
}else{
nav.classList.remove("scrolled")
}

})

</script>

</body>

</html>
