<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JProda - Mudanza de Dominio</title>
    <link rel="icon" href="img/logo.png" sizes="32x32">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #212121;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* BACKGROUND ANIMADO */
        .bg {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -2;
            background:
                radial-gradient(circle at 20% 30%, #CBFE0033, transparent 40%),
                radial-gradient(circle at 80% 70%, #CBFE0040, transparent 40%),
                radial-gradient(circle at 50% 50%, #CBFE0025, transparent 50%);
            filter: blur(140px);
            animation: move 18s infinite alternate ease-in-out;
        }

        @keyframes move {
            0% { transform: translate(-10%, -10%) scale(1) }
            100% { transform: translate(10%, 10%) scale(1.2) }
        }

        /* GRID BACKGROUND */
        .grid {
            position: fixed;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        .migration-container {
            text-align: center;
            padding: 20px;
            max-width: 600px;
            z-index: 1;
        }

        .hero-logo-center {
            width: 150px;
            margin-bottom: 40px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(203, 254, 0, 0.5));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .migration-title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 30px;
        }

        .lime {
            color: #CBFE00;
            text-shadow: 0 0 15px rgba(203, 254, 0, 0.4);
        }

        /* BOTÓN CON TIPOGRAFÍA INTER */
        .new-domain-box {
            display: inline-block;
            padding: 18px 40px;
            border-radius: 14px;
            background: linear-gradient(135deg, #CBFE00, #9EDB00);
            color: #212121;
            font-weight: 700;
            font-family: 'Inter', sans-serif; /* Cambiado de Orbitron a Inter */
            text-decoration: none;
            font-size: 20px;
            transition: 0.4s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .new-domain-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(203, 254, 0, 0.5);
        }

        .redirect-notice {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.6;
        }

        @media(max-width:768px) {
            .migration-title { font-size: 24px; }
            .new-domain-box { width: 100%; }
        }
    </style>
</head>

<body>
    <div class="bg"></div>
    <div class="grid"></div>

    <div class="migration-container">
        <img src="img/logo.png" alt="Logo" class="hero-logo-center">

        <h1 class="migration-title">
            Hey, detectamos que usas un enlace antiguo.<br>
            <span class="lime">Hemos migrado de dominio.</span>
        </h1>

        <a href="https://jproda.xyz" class="new-domain-box">
            Ir a jproda.xyz
        </a>

        <p class="redirect-notice">Redirigiendo automáticamente en <span id="countdown">5</span> segundos...</p>
    </div>

    <script>
        // Script de redirección forzada con cuenta atrás
        let seconds = 5;
        const display = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            seconds--;
            display.innerText = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = "https://jproda.xyz";
            }
        }, 1000);

        // Intento de redirección inmediata por si el contador falla
        setTimeout(() => {
            window.location.replace("https://jproda.xyz");
        }, 6000);
    </script>
</body>

</html>
